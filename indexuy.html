<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Electric Glass</title>
    <link rel="stylesheet" href="login.css">
   <!-- Carga la librería primero -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        // Esta función espera a que TODO el HTML esté cargado
        document.addEventListener("DOMContentLoaded", function() {
            lucide.createIcons();
        });
    </script>
</head>
<body>

    <!-- El fondo dinámico para que el vidrio resalte -->
    <div class="blob"></div>
    
    <div class="login-card">
        <div class="logo">
            <i data-lucide="zap" class="icon-electric"></i>
        </div>
        <h2>Bienvenido</h2>
        <p class="subtitle">Ingresa tus credenciales para continuar</p>

        <form>
            <div class="input-group">
                <label>Email</label>
                <div class="input-wrapper">
                    <i data-lucide="mail"></i>
                    <input type="email" placeholder="correo@ejemplo.com">
                </div>
            </div>

            <div class="input-group">
                <label>Contraseña</label>
                <div class="input-wrapper">
                    <i data-lucide="lock"></i>
                    <input type="password" placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="btn-electric">
                ACCEDER <i data-lucide="chevron-right"></i>
            </button>
        </form>

        <div class="footer-links">
            <a href="#">¿Olvidaste tu contraseña?</a>
            <span>•</span>
            <a href="#">Crear cuenta</a>
        </div>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
